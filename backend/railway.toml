[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run db:generate && npm run build"

[deploy]
startCommand = "npm run db:push && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environment]
NODE_ENV = "production"
