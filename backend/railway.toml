[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run db:generate && npm run build"

[deploy]
startCommand = "npm run db:migrate && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Set NODE_ENV=production (and all other secrets) in the Railway dashboard under Variables.
# The [environment] section is NOT a valid Railway config key and is silently ignored.
