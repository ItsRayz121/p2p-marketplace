<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reconnecting — RupChain</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f8fafc; --surface:#ffffff; --border:#e2e8f0;
    --text:#0f172a; --muted:#64748b; --primary:#2563eb; --primary-fg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --surface:#111a2e; --border:#1e293b;
      --text:#f1f5f9; --muted:#94a3b8; --primary:#3b82f6; --primary-fg:#ffffff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px; background:var(--surface);
    border:1px solid var(--border); border-radius:16px;
    padding:32px 24px; text-align:center;
    box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  }
  .logo{width:56px;height:56px;margin:0 auto 20px;display:block;border-radius:14px}
  h1{margin:0 0 8px;font-size:20px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
  p{margin:0;font-size:14.5px;line-height:1.6;color:var(--muted)}
  .btn{
    display:block;width:100%;margin-top:24px;padding:13px 20px;
    font:inherit;font-size:15px;font-weight:600;
    color:var(--primary-fg);background:var(--primary);
    border:0;border-radius:10px;cursor:pointer;
  }
  .btn:active{opacity:.85}
  .btn[disabled]{opacity:.6;cursor:default}
  .status{margin-top:14px;font-size:13px;color:var(--muted);min-height:1.2em}
  .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--muted);margin-right:7px;vertical-align:middle;
  }
  .dot.online{background:#16a34a}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/brand/icon-192.png" alt="" width="56" height="56">
    <h1>Reconnecting to RupChain</h1>
    <p>Your connection dropped for a moment. Nothing was lost — your trades, orders and balances are safe on our servers.</p>
    <button class="btn" id="retry" type="button">Try again</button>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking connection…</span></div>
  </main>

<script>
(function () {
  var btn = document.getElementById('retry')
  var dot = document.getElementById('dot')
  var statusText = document.getElementById('statusText')

  // Where the user actually wanted to go, so "Try again" resumes the real
  // journey instead of dumping everyone on the homepage.
  //
  // The service worker serves this markup as the response to the FAILED
  // request, so the address bar still holds the intended route and
  // location.pathname is already correct. __OFFLINE_FROM is injected by the
  // worker as the explicit signal; the location fallback covers the case where
  // this file is reached some other way.
  var target = window.__OFFLINE_FROM || (location.pathname + location.search)

  // Never navigate off-origin, and never loop back onto this file when it is
  // opened directly at /offline.html.
  if (target.charAt(0) !== '/' || target.charAt(1) === '/') target = '/'
  if (target.indexOf('/offline.html') === 0) target = '/'

  function setStatus(online) {
    dot.className = online ? 'dot online' : 'dot'
    statusText.textContent = online ? 'Back online — tap Try again' : 'Waiting for a connection…'
  }

  var retrying = false
  function retry() {
    if (retrying) return
    retrying = true
    btn.disabled = true
    statusText.textContent = 'Reconnecting…'
    location.replace(target)
  }

  btn.addEventListener('click', retry)
  window.addEventListener('online', function () { setStatus(true); retry() })
  window.addEventListener('offline', function () { setStatus(false) })
  setStatus(navigator.onLine)

  // The radio is usually back long before the user taps anything. Poll a tiny
  // same-origin asset and self-heal the moment it answers, so in the common
  // case this screen disappears on its own.
  var tries = 0
  var timer = setInterval(function () {
    if (++tries > 40) { clearInterval(timer); return }   // ~2 minutes, then idle
    fetch('/manifest.json', { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { if (r && r.ok) { clearInterval(timer); retry() } })
      .catch(function () { /* still down */ })
  }, 3000)
})()
</script>
</body>
</html>
