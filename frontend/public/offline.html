<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D1B2A">
<title>RupChain — You’re Offline</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f8fafc; --fg:#0f172a; --soft:#64748b; --primary:#2563eb; --ring:#93c5fd;
    --line:#94a3b8; --dim:#cbd5e1; --glow:#2563eb; --node:#e2e8f0; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0D1B2A; --fg:#f1f5f9; --soft:#94a3b8; --primary:#3b82f6;
    --line:#5b708a; --dim:#2b3d52; --glow:#60a5fa; --node:#16293f; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { width:100%; max-width:22rem; text-align:center; }
  h1 { font-size:1.5rem; line-height:1.3; font-weight:700; margin:.25rem 0 1.5rem; letter-spacing:-.01em; }
  button { font:inherit; font-weight:600; background:var(--primary); color:#fff; border:0; border-radius:.6rem; padding:.7rem 1.6rem; min-width:9rem; min-height:44px; cursor:pointer; }
  button[disabled] { opacity:.7; cursor:default; }
  button:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
  #status { min-height:1.25rem; margin:.9rem 0 0; font-size:.8rem; color:var(--soft); }

  /* Illustration: a technician repairs a damaged signal cable beside a tower.
     One 7s loop: signal weakens -> a link fades -> repair -> waves pulse back. */
  .scene { display:block; width:100%; max-width:19rem; height:auto; margin:0 auto .5rem; overflow:visible; }
  .scene .st { fill:none; stroke:var(--line); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .scene .node { fill:var(--node); stroke:var(--line); stroke-width:2; }
  .scene .ground { stroke:var(--dim); stroke-width:2; stroke-linecap:round; }
  .scene .body { fill:var(--primary); }
  .scene .skin { fill:var(--line); }
  .scene .hat { fill:var(--glow); }
  .wave { fill:none; stroke:var(--glow); stroke-width:2.5; stroke-linecap:round; opacity:.9; animation:wave 7s ease-in-out infinite; }
  .wave.w2 { animation-delay:.2s; } .wave.w3 { animation-delay:.4s; }
  .link { stroke:var(--glow); stroke-dasharray:3 5; animation:link 7s ease-in-out infinite; }
  .patch { fill:none; stroke:var(--glow); stroke-width:2.5; stroke-linecap:round; opacity:0; animation:patch 7s ease-in-out infinite; }
  .tip { fill:var(--glow); opacity:0; animation:patch 7s ease-in-out infinite; }
  .tech { animation:sway 4s ease-in-out infinite alternate; transform-origin:130px 60px; }
  .arm { animation:work .7s ease-in-out infinite alternate; transform-origin:136px 102px; }
  .cap { stroke:var(--glow); }
  @keyframes wave  { 0%,10% { opacity:.9 } 28%,62% { opacity:.12 } 78% { opacity:1 } 90%,100% { opacity:.9 } }
  @keyframes link  { 0%,12% { opacity:1 } 30%,62% { opacity:.12 } 82%,100% { opacity:1 } }
  @keyframes patch { 0%,40% { opacity:0 } 62%,86% { opacity:1 } 100% { opacity:0 } }
  @keyframes sway  { from { transform:rotate(-2.5deg) } to { transform:rotate(2.5deg) } }
  @keyframes work  { from { transform:rotate(-14deg) } to { transform:rotate(10deg) } }
  /* Connection restored: every part settles into the normal brand colour. */
  .restored .wave, .restored .link, .restored .patch, .restored .tip, .restored .arm, .restored .tech { animation:none; }
  .restored .wave, .restored .link, .restored .patch { opacity:1; transition:opacity .3s ease; }
  .restored .tower { stroke:var(--glow); transition:stroke .3s ease; }
  .restored .scene { filter:drop-shadow(0 0 8px var(--glow)); transition:filter .3s ease; }
  @media (prefers-reduced-motion: reduce) {
    .wave, .link, .patch, .tip, .tech, .arm { animation:none; }
    .wave.w1 { opacity:.9 } .wave.w2 { opacity:.5 } .wave.w3 { opacity:.15 }
    .link { opacity:.35 } .patch { opacity:0 }
  }
</style>
</head>
<!-- data-reason / data-sw / data-api are filled in by sw.js when it serves this page. -->
<body data-reason="network" data-sw="" data-api="">
<main role="main">
  <svg class="scene" viewBox="0 -16 240 200" role="img" aria-label="A technician repairing a signal tower cable">
    <line class="ground" x1="14" y1="180" x2="226" y2="180"/>
    <!-- blockchain-style network nodes -->
    <path class="st" d="M190 70 L214 112 L180 152"/>
    <circle class="node" cx="190" cy="70" r="6"/><circle class="node" cx="214" cy="112" r="6"/><circle class="node" cx="180" cy="152" r="6"/>
    <path class="st link" d="M70 20 Q130 6 190 70"/>
    <!-- tower -->
    <g class="st tower">
      <path d="M70 40 L40 180 M70 40 L100 180"/>
      <path d="M63.4 80 H76.6 M54.9 120 H85.1 M46.3 160 H93.7"/>
      <path d="M63.4 80 L85.1 120 M76.6 80 L54.9 120 M54.9 120 L93.7 160 M85.1 120 L46.3 160"/>
      <path d="M70 40 V22"/>
    </g>
    <circle class="node cap" cx="70" cy="18" r="4"/>
    <path class="wave w1" d="M60 18 A10 10 0 0 1 80 18"/>
    <path class="wave w2" d="M52 18 A18 18 0 0 1 88 18"/>
    <path class="wave w3" d="M44 18 A26 26 0 0 1 96 18"/>
    <!-- damaged cable: two ends and a gap the technician closes -->
    <path class="st" d="M88 126 L116 130 M144 134 L176 150"/>
    <path class="patch" d="M116 130 L144 134"/>
    <!-- technician hanging from a boom, reconnecting the cable -->
    <path class="st" d="M76.6 60 H130"/>
    <g class="tech">
      <path class="st" d="M130 60 V86"/>
      <circle class="skin" cx="130" cy="92" r="5"/>
      <path class="hat" d="M124.5 91 a5.5 5.5 0 0 1 11 0 Z"/>
      <rect class="body" x="124" y="98" width="12" height="18" rx="3"/>
      <path class="st" d="M127 116 V126 M133 116 V126"/>
      <g class="arm"><path class="st" d="M136 102 L146 126" style="stroke:var(--fg)"/><circle class="tip" cx="146" cy="128" r="3"/></g>
    </g>
  </svg>
  <h1 id="title">You&rsquo;re Offline</h1>
  <button type="button" id="retry">Try Again</button>
  <p id="status" role="status" aria-live="polite"></p>
  <code id="diag" hidden></code>
</main>
<script>
(function () {
  'use strict';
  var body = document.body;
  var reason = body.getAttribute('data-reason') || 'network';
  var api = body.getAttribute('data-api') || '';
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('retry');

  function setReason(r) {
    reason = r;
    // A server-side failure must not blame the visitor's connection.
    document.getElementById('title').textContent = r === 'server'
      ? 'Connection Interrupted'
      : "You\u2019re Offline";
  }
  setReason(reason);
  document.getElementById('diag').textContent =
    (reason === 'server' ? 'server' : 'network') + (body.getAttribute('data-sw') ? ' · sw ' + body.getAttribute('data-sw') : '');

  // ── Reload-loop guard ─────────────────────────────────────────────────────
  // Every automatic reload is recorded. If the page keeps coming back here, stop
  // reloading on our own and wait for the user to tap "Try again".
  //
  // The guard only works if the record survives the reload. When sessionStorage
  // is missing, throws (blocked storage, some private modes and WebViews), or does
  // not read back what was written, there is no guard — so there are no automatic
  // reloads at all. Checks still run and say when RupChain is back; the user taps.
  var KEY = 'rc-offline-auto-reloads', WINDOW_MS = 2 * 60 * 1000, MAX_AUTO = 3;
  var guardOk = (function () {
    try {
      var probe = 'rc-offline-probe', v = String(Date.now());
      sessionStorage.setItem(probe, v);
      var ok = sessionStorage.getItem(probe) === v;
      sessionStorage.removeItem(probe);
      return ok;
    } catch (e) { return false; }
  })();
  // Recent automatic reloads, or null when the record cannot be trusted.
  function recentAutoReloads() {
    if (!guardOk) return null;
    try {
      var now = Date.now(), l = JSON.parse(sessionStorage.getItem(KEY) || '[]');
      if (!Array.isArray(l)) return null;
      return l.filter(function (t) { return typeof t === 'number' && now - t < WINDOW_MS; });
    } catch (e) { return null; }
  }
  // Record one automatic reload. True only when the record was written and reads back.
  function noteAutoReload() {
    var l = recentAutoReloads();
    if (!l) return false;
    try {
      l.push(Date.now());
      var v = JSON.stringify(l);
      sessionStorage.setItem(KEY, v);
      return sessionStorage.getItem(KEY) === v;
    } catch (e) { return false; }
  }
  function autoReloadAllowed() {
    var l = recentAutoReloads();
    return !!l && l.length < MAX_AUTO;
  }

  // ── Recovery check ────────────────────────────────────────────────────────
  // Uncached requests to the real service, not navigator.onLine and not a static
  // file: the page the user wanted (proves the website answers) and, when known,
  // the API's readiness check (proves the backend AND its database answer — the
  // plain ping does not touch the database, so it cannot show that the app's data
  // is reachable again). Nothing is submitted.
  function timed(url, ms, init) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var t;
    var opts = init || {};
    opts.cache = 'no-store';
    if (ctl) opts.signal = ctl.signal;
    // The hard timer also covers browsers without AbortController, where the fetch
    // itself cannot be stopped: the check settles either way.
    return Promise.race([
      fetch(url, opts),
      new Promise(function (_, reject) { t = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error('timeout')); }, ms); }),
    ]).then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
  }
  function check() {
    return timed(location.href, 10000, { credentials: 'same-origin', redirect: 'follow' })
      .then(function (r) {
        if (r.status >= 500) return { page: false, api: false, server: true };
        if (!api) return { page: true, api: true };
        return timed(api.replace(/\/$/, '') + '/health/ready', 8000, { mode: 'cors' })
          // 404: an API build without the readiness route yet (frontend deployed first).
          // The API is reachable but readiness is unknown: not proof of recovery, so no
          // automatic reload; the person decides with "Try again".
          .then(function (a) {
            if (a.status === 404) return { page: true, api: false, reachable: true, server: false };
            return { page: true, api: a.ok, server: !a.ok };
          }, function () { return { page: true, api: false, server: false }; });
      }, function () { return { page: false, api: false, server: false }; });
  }

  // Light the tower up in the normal brand colour for a moment, then reload. Skipped
  // (immediate reload) when animations are unavailable or the user asked for less motion.
  function restoredThenReload() {
    var calm = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!body.classList || calm) { location.reload(); return; }
    body.classList.add('restored');
    statusEl.textContent = '';
    setTimeout(function () { location.reload(); }, 450);
  }

  var running = false, timer = null, attempt = 0;
  var DELAYS = [3000, 6000, 12000, 20000, 30000];

  function schedule() {
    clearTimeout(timer);
    if (document.hidden) return; // resume on visibilitychange
    timer = setTimeout(function () { run(false); }, DELAYS[Math.min(attempt, DELAYS.length - 1)]);
  }

  function run(manual) {
    if (running) return;
    var auto = !manual;
    if (auto && guardOk && !autoReloadAllowed()) {
      statusEl.textContent = 'Tap "Try again" when your connection is back.';
      return;
    }
    running = true;
    btn.disabled = true;
    statusEl.textContent = 'Reconnecting…';
    check().then(function (res) {
      running = false;
      btn.disabled = false;
      // A manual tap reloads as soon as the website answers. An automatic check
      // also waits for the API, so we don't bounce the user into a broken app —
      // and only reloads when the loop guard could record it.
      if (res.page && (manual || res.api)) {
        if (manual || noteAutoReload()) { restoredThenReload(); return; }
        guardOk = false;
        statusEl.textContent = 'RupChain is back. Tap "Try again" to continue.';
        return;
      }
      if (res.server) setReason('server');
      attempt++;
      statusEl.textContent = res.reachable
        ? 'RupChain is reachable. Tap "Try again" to continue.'
        : res.page ? 'The website is back, but RupChain is still not responding.' : "Still can't connect. We'll keep trying.";
      schedule();
    }, function () {
      running = false;
      btn.disabled = false;
      attempt++;
      statusEl.textContent = "Still can't connect. We'll keep trying.";
      schedule();
    });
  }

  btn.addEventListener('click', function () { attempt = 0; clearTimeout(timer); run(true); });
  window.addEventListener('online', function () { attempt = 0; clearTimeout(timer); run(false); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { attempt = 0; clearTimeout(timer); run(false); } });
  schedule();
})();
</script>
</body>
</html>
