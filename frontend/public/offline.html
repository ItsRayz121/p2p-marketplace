<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RupChain — you're offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f8fafc; color:#0f172a; }
  @media (prefers-color-scheme: dark) { body { background:#0f172a; color:#f1f5f9; } .card p { color:#94a3b8 !important; } }
  .card { max-width:22rem; padding:2rem 1.5rem; text-align:center; }
  img { width:64px; height:64px; border-radius:22%; }
  h1 { font-size:1.25rem; margin:1rem 0 .5rem; }
  p { margin:.25rem 0 1.25rem; font-size:.9rem; line-height:1.5; color:#475569; }
  button { font:inherit; font-weight:600; background:#2563eb; color:#fff; border:0; border-radius:.6rem; padding:.65rem 1.4rem; cursor:pointer; }
  button:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
  small { display:block; margin-top:1rem; color:#64748b; font-size:.75rem; }
</style>
</head>
<body>
<main class="card" role="main">
  <img src="/brand/icon-192.png" alt="RupChain" width="64" height="64">
  <h1>You're offline</h1>
  <p>RupChain couldn't be reached. Check your connection and try again. Nothing was submitted or changed, and no payment is ever sent from this page.</p>
  <button type="button" id="retry">Try again</button>
  <small>If this keeps happening on a good connection, contact support@rupchain.com.</small>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
